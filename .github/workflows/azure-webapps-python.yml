name: Build and deploy a container to an Azure Web App

env:
  AZURE_WEBAPP_NAME: 'opetbrasil'

on:
  push:
    branches:
      - "main"

  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
    
      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
    
      - name: Login no ACR
        run: az acr login --name cropet
    
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      	
      - name: Log in to GitHub container registry
	
        uses: docker/login-action@v3
	
        with:
	
          registry: ghcr.io
	
          username: ${{ github.actor }}
	
          password: ${{ github.token }}
	

	
      - name: Lowercase the repo name and username
	
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
    
      - name: Build Docker
        run: |
          docker build \
            -t cropet.azurecr.io/opetbrasil:latest .
    
      - name: Push Docker
        run: |
          docker push \
            cropet.azurecr.io/opetbrasil:latest
    
  deploy:
    permissions:
      contents: none
    
    runs-on: ubuntu-latest
    needs: build
    
    environment:
      name: Development
    
    steps:
      - name: Login no Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
    
      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: 'cropet.azurecr.io/opetbrasil:latest'
